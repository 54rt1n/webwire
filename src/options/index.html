<!DOCTYPE html>
<html>
<head>
  <title>Webpage Capture Assistant - Options</title>
  <style>
    body {
      padding: 20px;
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-section {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 10px;
      background-color: #fff;
    }

    .form-section h2 {
      margin-top: 0;
      font-size: 1.2em;
      color: #333;
    }
    
    .form-section h3 {
      margin-top: 0;
      font-size: 1.1em;
      color: #555;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    select,
    textarea {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    select {
      background-color: white;
      cursor: pointer;
    }

    textarea {
      min-height: 100px;
      font-family: monospace;
      resize: vertical;
    }

    input[type="number"] {
      width: 120px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
      align-self: flex-start;
    }

    button:hover {
      background-color: #45a049;
    }

    button.secondary-btn {
      background-color: #607d8b;
    }

    button.secondary-btn:hover {
      background-color: #546e7a;
    }

    button.delete-btn {
      background-color: #f44336;
      color: white;
      padding: 6px 12px;
      font-size: 12px;
    }

    button.delete-btn:hover {
      background-color: #d32f2f;
    }

    .status {
      padding: 10px;
      border-radius: 4px;
      display: none;
      margin-top: 15px;
    }

    .success {
      background-color: #dff0d8;
      color: #3c763d;
      border: 1px solid #d6e9c6;
    }

    .error {
      background-color: #f2dede;
      color: #a94442;
      border: 1px solid #ebccd1;
    }

    small {
      color: #666;
      font-size: 12px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .model-config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .model-config {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 10px;
      background-color: #fff;
    }

    .model-config h3 {
      margin-top: 0;
      font-size: 1.1em;
      color: #555;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
      margin-bottom: 15px;
    }

    .drag-handle {
      cursor: grab;
      opacity: 0.5;
      padding: 4px;
      transition: opacity 0.2s;
    }

    .drag-handle:hover {
      opacity: 1;
    }

    .collapse-btn {
      background: none;
      border: none;
      color: #607d8b;
      cursor: pointer;
      font-size: 14px;
      padding: 4px 8px;
      transition: all 0.2s;
      align-self: flex-start;
    }

    .collapse-btn:hover {
      color: #455a64;
      background-color: rgba(0, 0, 0, 0.05);
      border-radius: 4px;
    }

    .advanced-settings {
      background-color: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 12px;
      margin-top: 10px;
    }

    .advanced-settings h4 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #555;
      font-size: 14px;
    }

    .advanced-toggle {
      background: none;
      border: none;
      color: #2196F3;
      cursor: pointer;
      padding: 4px 0;
      font-size: 13px;
      text-align: left;
    }

    .advanced-toggle:hover {
      text-decoration: underline;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-group input[type="checkbox"] {
      width: auto;
      margin: 0;
    }

    @media (max-width: 768px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Webpage Capture Assistant Options</h1>
    
    <div class="form-section">
      <h2>General Settings</h2>
      <div class="grid-2">
        <div class="form-group">
          <label for="userName">User Name:</label>
          <input type="text" id="userName" placeholder="Enter your user name">
          <small>Identifier for the current user.</small>
        </div>
        <div class="form-group">
          <label for="personaName">Persona Name:</label>
          <input type="text" id="personaName" placeholder="Enter persona name">
          <small>The persona to use for the AI.</small>
        </div>
        <div class="form-group">
          <label for="mcpServerUrl">MCP Server URL:</label>
          <input type="text" id="mcpServerUrl" placeholder="Enter MCP server URL (e.g., http://localhost:8000/sse)">
          <small>The URL of your MCP server for tool-enabled agents.</small>
        </div>
      </div>
      <div class="grid-2" style="margin-top: 15px;">
        <div class="form-group checkbox-group">
          <input type="checkbox" id="showThought">
          <label for="showThought">Show Thought Process</label>
        </div>
        <div class="form-group checkbox-group">
          <input type="checkbox" id="autoThink">
          <label for="autoThink">Enable Auto-Think</label>
        </div>
      </div>
    </div>

    <div class="form-section">
        <h2>Provider Settings</h2>
        <div class="grid-2">
            <div class="form-group">
                <label for="featherlessApiKey">Featherless API Key:</label>
                <input type="password" id="featherlessApiKey" placeholder="Enter Featherless API key">
            </div>
            <div class="form-group">
                <label for="openaiApiKey">OpenAI API Key:</label>
                <input type="password" id="openaiApiKey" placeholder="Enter OpenAI API key">
            </div>
            <div class="form-group">
                <label for="googleApiKey">Google API Key:</label>
                <input type="password" id="googleApiKey" placeholder="Enter Google API key">
            </div>
            <div class="form-group">
                <label for="anthropicApiKey">Anthropic API Key:</label>
                <input type="password" id="anthropicApiKey" placeholder="Enter Anthropic API key">
            </div>
            <div class="form-group">
                <label for="groqApiKey">Groq API Key:</label>
                <input type="password" id="groqApiKey" placeholder="Enter Groq API key">
            </div>
             <div class="form-group">
                <label for="metaApiKey">Meta API Key:</label>
                <input type="password" id="metaApiKey" placeholder="Enter Meta API key">
            </div>
        </div>
        <h3>AIMind</h3>
        <div class="grid-2">
            <div class="form-group">
                <label for="aimindApiEndpoint">AIMind API Endpoint:</label>
                <input type="text" id="aimindApiEndpoint" placeholder="e.g. http://localhost:8000/v1">
            </div>
            <div class="form-group">
                <label for="aimindApiKey">AIMind API Key:</label>
                <input type="password" id="aimindApiKey" placeholder="Enter AIMind API key">
            </div>
        </div>
        <h3>OpenRouter</h3>
        <div class="grid-2">
            <div class="form-group">
                <label for="openrouterApiEndpoint">OpenRouter API Endpoint:</label>
                <input type="text" id="openrouterApiEndpoint" placeholder="e.g. https://openrouter.ai/api/v1">
            </div>
            <div class="form-group">
                <label for="openrouterApiKey">OpenRouter API Key:</label>
                <input type="password" id="openrouterApiKey" placeholder="Enter OpenRouter API key">
            </div>
        </div>
    </div>
    
    <div class="form-section">
      <h2>Model Configuration</h2>
      
      <!-- Chat Model -->
      <div class="model-config">
        <h3>Chat Model (Primary)</h3>
        <div class="model-config-grid">
            <div class="form-group">
                <label for="chatModel">Model Name:</label>
                <input type="text" id="chatModel" placeholder="e.g., gpt-4-turbo">
            </div>
            <div class="form-group">
                <label for="chatProvider">Provider:</label>
                <select id="chatProvider">
                    <option value="featherless">Featherless</option>
                    <option value="openai">OpenAI</option>
                    <option value="google">Google</option>
                    <option value="anthropic">Anthropic</option>
                    <option value="groq">Groq</option>
                    <option value="meta">Meta</option>
                    <option value="aimind">AIMind</option>
                    <option value="openrouter">OpenRouter</option>
                </select>
            </div>
            <div class="form-group">
                <label for="chatTemp">Temperature:</label>
                <input type="number" id="chatTemp" min="0" max="2" step="0.1" placeholder="0.8">
            </div>
            <div class="form-group">
                <label for="chatMaxTokens">Max Tokens:</label>
                <input type="number" id="chatMaxTokens" min="1" placeholder="2048">
            </div>
            <div class="form-group">
                <label for="chatTopP">Top P:</label>
                <input type="number" id="chatTopP" min="0" max="1" step="0.01" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="chatMinP">Min P:</label>
                <input type="number" id="chatMinP" min="0" max="1" step="0.01" placeholder="0.05">
            </div>
            <div class="form-group">
                <label for="chatTopK">Top K:</label>
                <input type="number" id="chatTopK" min="1" step="1" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="chatFreqPenalty">Frequency Penalty:</label>
                <input type="number" id="chatFreqPenalty" min="-2" max="2" step="0.1" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="chatPresPenalty">Presence Penalty:</label>
                <input type="number" id="chatPresPenalty" min="-2" max="2" step="0.1" placeholder="Optional">
            </div>
        </div>
      </div>

      <!-- Thought Model -->
      <div class="model-config">
        <h3>Thought Model (Optional)</h3>
        <div class="model-config-grid">
            <div class="form-group">
                <label for="thoughtModel">Model Name:</label>
                <input type="text" id="thoughtModel" placeholder="Leave blank to use Chat Model">
            </div>
            <div class="form-group">
                <label for="thoughtProvider">Provider:</label>
                 <select id="thoughtProvider">
                    <option value="">(Same as Chat)</option>
                    <option value="featherless">Featherless</option>
                    <option value="openai">OpenAI</option>
                    <option value="google">Google</option>
                    <option value="anthropic">Anthropic</option>
                    <option value="groq">Groq</option>
                    <option value="meta">Meta</option>
                    <option value="aimind">AIMind</option>
                    <option value="openrouter">OpenRouter</option>
                </select>
            </div>
            <div class="form-group">
                <label for="thoughtTemp">Temperature:</label>
                <input type="number" id="thoughtTemp" min="0" max="2" step="0.1" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="thoughtMaxTokens">Max Tokens:</label>
                <input type="number" id="thoughtMaxTokens" min="1" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="thoughtTopP">Top P:</label>
                <input type="number" id="thoughtTopP" min="0" max="1" step="0.01" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="thoughtMinP">Min P:</label>
                <input type="number" id="thoughtMinP" min="0" max="1" step="0.01" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="thoughtTopK">Top K:</label>
                <input type="number" id="thoughtTopK" min="1" step="1" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="thoughtFreqPenalty">Frequency Penalty:</label>
                <input type="number" id="thoughtFreqPenalty" min="-2" max="2" step="0.1" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="thoughtPresPenalty">Presence Penalty:</label>
                <input type="number" id="thoughtPresPenalty" min="-2" max="2" step="0.1" placeholder="Optional">
            </div>
        </div>
      </div>

      <!-- Tool Model -->
      <div class="model-config">
        <h3>Tool Model (Optional)</h3>
        <div class="model-config-grid">
            <div class="form-group">
                <label for="toolModel">Model Name:</label>
                <input type="text" id="toolModel" placeholder="Leave blank to use Chat Model">
            </div>
            <div class="form-group">
                <label for="toolProvider">Provider:</label>
                 <select id="toolProvider">
                    <option value="">(Same as Chat)</option>
                    <option value="featherless">Featherless</option>
                    <option value="openai">OpenAI</option>
                    <option value="google">Google</option>
                    <option value="anthropic">Anthropic</option>
                    <option value="groq">Groq</option>
                    <option value="meta">Meta</option>
                    <option value="aimind">AIMind</option>
                    <option value="openrouter">OpenRouter</option>
                </select>
            </div>
             <div class="form-group">
                <label for="toolTemp">Temperature:</label>
                <input type="number" id="toolTemp" min="0" max="2" step="0.1" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="toolMaxTokens">Max Tokens:</label>
                <input type="number" id="toolMaxTokens" min="1" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="toolTopP">Top P:</label>
                <input type="number" id="toolTopP" min="0" max="1" step="0.01" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="toolMinP">Min P:</label>
                <input type="number" id="toolMinP" min="0" max="1" step="0.01" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="toolTopK">Top K:</label>
                <input type="number" id="toolTopK" min="1" step="1" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="toolFreqPenalty">Frequency Penalty:</label>
                <input type="number" id="toolFreqPenalty" min="-2" max="2" step="0.1" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="toolPresPenalty">Presence Penalty:</label>
                <input type="number" id="toolPresPenalty" min="-2" max="2" step="0.1" placeholder="Optional">
            </div>
        </div>
      </div>
    </div>
    
    <button id="saveBtn">Save All Settings</button>
    <div id="status" class="status"></div>
  </div>

  <script src="./index.js" type="module"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebWire - Prompts Library</title>
</head>
<body class="ww-container-base">
    <div class="ww-container">
        <!-- Header -->
        <header class="prompts-header">
            <div class="ww-container">
                <h1>Prompts Library</h1>
                <div class="header-actions">
                    <button id="import-prompts-btn" class="btn btn-secondary" title="Import prompts from JSON file">
                        <span class="btn-icon">📥</span>
                        Import
                    </button>
                    <button id="export-all-prompts-btn" class="btn btn-secondary" title="Export all prompts">
                        <span class="btn-icon">📤</span>
                        Export All
                    </button>
                    <button id="new-prompt-btn" class="btn btn-primary" title="Create a new prompt">
                        <span class="btn-icon">+</span>
                        New Prompt
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="prompts-content">
            <div class="ww-container">
                <!-- Controls section -->
                <div class="prompts-controls">
                    <div class="prompts-count">
                        <span id="prompts-count-display">0 prompts</span>
                    </div>
                    <div class="search-wrapper">
                        <input type="text" id="prompts-search" class="search-input" placeholder="Search prompts...">
                    </div>
                </div>

                <!-- Prompts Grid -->
                <div id="prompts-list-container" class="prompts-grid">
                    <!-- Prompts will be rendered here -->
                </div>

                <!-- Empty State -->
                <div id="prompts-empty-state" class="empty-state" style="display: none;">
                    <div class="empty-icon">📝</div>
                    <h3>No Prompts Yet</h3>
                    <p>Create your first prompt to get started</p>
                    <button class="btn btn-primary" onclick="document.getElementById('new-prompt-btn').click()">
                        Create First Prompt
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-confirmation-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Delete Prompt</h3>
                <button id="modal-close-btn" class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this prompt?</p>
                <div id="delete-prompt-details" class="delete-prompt-details">
                    <!-- Prompt details will be shown here -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-delete-btn" class="btn btn-secondary">Cancel</button>
                <button id="confirm-delete-btn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <!-- Prompt Edit Modal -->
    <div id="prompt-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="prompt-modal-title">Edit Prompt</h3>
                <button id="prompt-modal-close-btn" class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="prompt-form" class="prompt-form">
                    <!-- Basic Settings -->
                    <div class="form-section">
                        <h4>Basic Information</h4>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="prompt-id">Prompt ID</label>
                                <input type="text" id="prompt-id" class="form-control" placeholder="my-custom-prompt" required>
                                <small class="form-help">Unique identifier for this prompt</small>
                            </div>
                            <div class="form-group">
                                <label for="prompt-status">Status</label>
                                <select id="prompt-status" class="form-control">
                                    <option value="active">Active</option>
                                    <option value="inactive">Inactive</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="prompt-button-text">Button Text</label>
                                <input type="text" id="prompt-button-text" class="form-control" placeholder="My Action" required>
                            </div>
                            <div class="form-group">
                                <label for="prompt-button-icon">Button Icon</label>
                                <div class="icon-selector">
                                    <button type="button" id="prompt-button-icon" class="icon-display">
                                        <span id="prompt-icon-emoji">📖</span>
                                        <span class="icon-label">Click to change</span>
                                    </button>
                                    <input type="hidden" id="prompt-button-icon-value" value="📖">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Prompts Content -->
                    <div class="form-section">
                        <h4>Prompt Content</h4>
                        <div class="form-group">
                            <label for="prompt-user-prompt">User Prompt</label>
                            <textarea id="prompt-user-prompt" class="form-control" rows="3" 
                                      placeholder="The message shown to the user..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="prompt-system-prompt">System Prompt</label>
                            <textarea id="prompt-system-prompt" class="form-control" rows="8" 
                                      placeholder="Instructions for the AI model..." required></textarea>
                        </div>
                    </div>

                    <!-- Features -->
                    <div class="form-section">
                        <h4>Features</h4>
                        <div class="features-grid">
                            <label class="feature-toggle">
                                <input type="checkbox" id="feature-pageContent" name="feature-pageContent">
                                <span>Include Page Content</span>
                            </label>
                            <label class="feature-toggle">
                                <input type="checkbox" id="feature-mcp" name="feature-mcp">
                                <span>Enable MCP Tools</span>
                            </label>
                            <label class="feature-toggle">
                                <input type="checkbox" id="feature-autoThink" name="feature-autoThink">
                                <span>Auto-enable Thinking</span>
                            </label>
                            <label class="feature-toggle">
                                <input type="checkbox" id="feature-noBaseSystemPrompt" name="feature-noBaseSystemPrompt">
                                <span>Skip Base System Prompt</span>
                            </label>
                            <label class="feature-toggle">
                                <input type="checkbox" id="feature-browserTools" name="feature-browserTools">
                                <span>Enable Browser Tools</span>
                            </label>
                            <label class="feature-toggle">
                                <input type="checkbox" id="feature-autoExecuteTools" name="feature-autoExecuteTools">
                                <span>Auto-execute Tools</span>
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="prompt-modal-cancel-btn" class="btn btn-secondary">Cancel</button>
                <button id="prompt-modal-save-btn" class="btn btn-primary">Save Prompt</button>
            </div>
        </div>
    </div>
</body>
</html>

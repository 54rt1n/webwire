<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebWire - Prompts Library</title>
</head>
<body>
    <div class="ww-container-base ww-prompts">
        <!-- Header -->
        <div class="ww-prompts-header">
            <h1>
                <span class="ww-icon">⚡</span>
                Prompts Library
            </h1>
            <div class="ww-header-actions">
                <button id="import-prompts-btn" class="ww-btn-options" title="Import prompts from JSON file">
                    📥 Import
                </button>
                <button id="export-all-prompts-btn" class="ww-btn-export" title="Export all prompts">
                    📤 Export All
                </button>
                <button id="reset-prompts-btn" class="ww-btn-warning" title="Reset to default prompts">
                    🔄 Reset Prompts
                </button>
                <button id="new-prompt-btn" class="ww-btn-primary" title="Create a new prompt">
                    + New Prompt
                </button>
            </div>
        </div>

        <!-- Main Container -->
        <div class="ww-prompts-container">
            <!-- Stats Bar -->
            <div class="ww-stats-bar">
                <div class="ww-stat-item">
                    <span class="ww-stat-value" id="total-prompts-count">0</span>
                    <span class="ww-stat-label">Total Prompts</span>
                </div>
                <div class="ww-stat-item">
                    <span class="ww-stat-value" id="active-prompts-count">0</span>
                    <span class="ww-stat-label">Active</span>
                </div>
                <div class="ww-stat-item">
                    <span class="ww-stat-value" id="inactive-prompts-count">0</span>
                    <span class="ww-stat-label">Inactive</span>
                </div>
            </div>

            <!-- Search Section -->
            <div class="ww-search-section">
                <div class="ww-search-wrapper">
                    <svg class="ww-search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                    </svg>
                    <input type="text" id="prompts-search" class="ww-search-input" placeholder="Search prompts...">
                    <button id="search-clear-btn" class="ww-search-clear" style="display: none;">
                        <span class="ww-icon">✕</span>
                    </button>
                </div>
                <div class="ww-search-results" id="search-results" style="display: none;">
                    Showing <span id="visible-count">0</span> of <span id="total-count">0</span> prompts
                </div>
            </div>

            <!-- Prompts List -->
            <div id="prompts-list-container" class="ww-prompts-list">
                <!-- Prompts will be rendered here -->
            </div>

            <!-- Empty State -->
            <div id="prompts-empty-state" class="ww-empty-state" style="display: none;">
                <div class="ww-empty-icon">📝</div>
                <h3>No Prompts Yet</h3>
                <p>Create your first prompt to get started</p>
                <button class="ww-btn-primary ww-btn-add" onclick="document.getElementById('new-prompt-btn').click()">
                    Create First Prompt
                </button>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
    <div id="delete-confirmation-modal" class="ww-modal">
        <div class="ww-modal-content">
            <div class="ww-modal-header">
                <h2>Delete Prompt</h2>
                <button id="modal-close-btn" class="ww-modal-close">
                    <span class="ww-icon">✕</span>
                </button>
            </div>
            <div class="ww-modal-body">
                <p>Are you sure you want to delete this prompt?</p>
                <div id="delete-prompt-details" class="ww-prompt-preview">
                    <!-- Prompt details will be shown here -->
                </div>
            </div>
            <div class="ww-modal-footer">
                <button id="cancel-delete-btn" class="ww-btn-cancel">Cancel</button>
                <button id="confirm-delete-btn" class="ww-btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <!-- Prompt Edit Modal -->
    <div id="prompt-modal" class="ww-modal">
        <div class="ww-modal-content">
            <div class="ww-modal-header">
                <h2 id="prompt-modal-title">Edit Prompt</h2>
                <button id="prompt-modal-close-btn" class="ww-modal-close">
                    <span class="ww-icon">✕</span>
                </button>
            </div>
            <div class="ww-modal-body">
                <form id="prompt-form" class="ww-form">
                    <!-- Basic Settings -->
                    <div class="ww-form-section">
                        <h3>Basic Information</h3>
                        <div class="ww-grid-2">
                            <div class="ww-form-group">
                                <label class="ww-form-label" for="prompt-id">
                                    Prompt ID
                                    <span class="ww-label-required">*</span>
                                </label>
                                <input type="text" id="prompt-id" class="ww-form-input" placeholder="my-custom-prompt" required>
                                <small class="ww-form-help">Unique identifier for this prompt</small>
                            </div>
                            <div class="ww-form-group">
                                <label class="ww-form-label" for="prompt-status">Status</label>
                                <select id="prompt-status" class="ww-form-select">
                                    <option value="active">Active</option>
                                    <option value="inactive">Inactive</option>
                                </select>
                            </div>
                        </div>
                        <div class="ww-grid-2">
                            <div class="ww-form-group">
                                <label class="ww-form-label" for="prompt-button-text">
                                    Button Text
                                    <span class="ww-label-required">*</span>
                                </label>
                                <input type="text" id="prompt-button-text" class="ww-form-input" placeholder="My Action" required>
                            </div>
                            <div class="ww-form-group">
                                <label class="ww-form-label">Button Icon</label>
                                <div class="icon-selector">
                                    <button type="button" id="prompt-button-icon" class="icon-display">
                                        <span id="prompt-icon-emoji">📖</span>
                                        <span class="icon-label">Click to change</span>
                                    </button>
                                    <input type="hidden" id="prompt-button-icon-value" value="📖">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Prompts Content -->
                    <div class="ww-form-section">
                        <h3>Prompt Content</h3>
                        <div class="ww-form-group">
                            <label class="ww-form-label" for="prompt-user-prompt">
                                User Prompt
                                <span class="ww-label-required">*</span>
                            </label>
                            <textarea id="prompt-user-prompt" class="ww-form-textarea" rows="3" 
                                      placeholder="The message shown to the user..." required></textarea>
                        </div>
                        <div class="ww-form-group">
                            <label class="ww-form-label" for="prompt-system-prompt">
                                System Prompt
                                <span class="ww-label-required">*</span>
                            </label>
                            <textarea id="prompt-system-prompt" class="ww-form-textarea" rows="8" 
                                      placeholder="Instructions for the AI model..." required></textarea>
                        </div>
                    </div>

                    <!-- Features -->
                    <div class="ww-form-section">
                        <h3>Features</h3>
                        <div class="ww-grid-2">
                            <label class="ww-checkbox-label">
                                <input type="checkbox" id="feature-pageContent" name="feature-pageContent" class="ww-checkbox">
                                <span>Include Page Content</span>
                            </label>
                            <label class="ww-checkbox-label">
                                <input type="checkbox" id="feature-mcp" name="feature-mcp" class="ww-checkbox">
                                <span>Enable MCP Tools</span>
                            </label>
                            <label class="ww-checkbox-label">
                                <input type="checkbox" id="feature-autoThink" name="feature-autoThink" class="ww-checkbox">
                                <span>Auto-enable Thinking</span>
                            </label>
                            <label class="ww-checkbox-label">
                                <input type="checkbox" id="feature-noBaseSystemPrompt" name="feature-noBaseSystemPrompt" class="ww-checkbox">
                                <span>Skip Base System Prompt</span>
                            </label>
                            <label class="ww-checkbox-label">
                                <input type="checkbox" id="feature-browserTools" name="feature-browserTools" class="ww-checkbox">
                                <span>Enable Browser Tools</span>
                            </label>
                            <label class="ww-checkbox-label">
                                <input type="checkbox" id="feature-autoExecuteTools" name="feature-autoExecuteTools" class="ww-checkbox">
                                <span>Auto-execute Tools</span>
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="ww-modal-footer">
                <button id="prompt-modal-delete-btn" class="ww-btn-danger" style="display: none;">Delete</button>
                <div class="ww-modal-footer-right">
                    <button id="prompt-modal-cancel-btn" class="ww-btn-cancel">Cancel</button>
                    <button id="prompt-modal-save-as-btn" class="ww-btn-secondary">Save As</button>
                    <button id="prompt-modal-save-btn" class="ww-btn-primary">Save Prompt</button>
                </div>
            </div>
        </div>
    </div>
    </div> <!-- End of ww-container-base ww-prompts -->
</body>
</html>

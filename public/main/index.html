<!-- public/main.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebWire Test App</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex-grow: 1; overflow-y: auto; padding: 10px; border-bottom: 1px solid #ccc; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 5px; max-width: 80%; }
        .user { background-color: #dcf8c6; align-self: flex-end; }
        .assistant { background-color: #f1f0f0; align-self: flex-start; }
        #input-container { display: flex; padding: 10px; }
        #chat-input { flex-grow: 1; padding: 8px; border-radius: 5px; border: 1px solid #ccc; }
        #send-button { margin-left: 10px; padding: 8px 15px; }
        .icon-button { background: none; border: none; padding: 0; margin: 0; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-container">
        <!-- Messages will be appended here -->
    </div>
    <div id="input-container">
        <button id="reset-button" class="icon-button" title="Reset Chat">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-refresh-cw"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64M3.51 15A9 9 0 0 0 18.36 18.36"></path></svg>
        </button>
        <input type="text" id="chat-input" placeholder="Type your message...">
        <button id="send-button">Send</button>
    </div>

    <!-- The magic happens here -->
    <script type="module" src="./main.js"></script>
</body>
</html>
